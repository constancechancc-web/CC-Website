name: Sync NextSix Listings

on:
  schedule:
    # 22:00 UTC = 06:00 Malaysia time (UTC+8), daily
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync listings from NextSix
        run: npm run sync-listings

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No listing changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-sync Featured Listings from NextSix"
          git push
